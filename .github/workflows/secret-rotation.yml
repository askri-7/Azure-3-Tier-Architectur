name: Key Vault secret rotation

on:
  workflow_dispatch:
    inputs:
      key_vault_name:
        description: Key Vault resource name
        required: true
        type: string
      secret_name:
        description: Secret to rotate
        required: true
        type: string
      expires_on:
        description: Optional ISO 8601 expiry timestamp for the new version
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  rotate:
    name: Create a new Key Vault secret version
    runs-on: ubuntu-latest
    environment: secret-rotation
    steps:
      - name: Azure login using rotation identity
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.SECRET_ROTATION_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Write new secret version
        env:
          ROTATED_SECRET_VALUE: ${{ secrets.ROTATED_SECRET_VALUE }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ROTATED_SECRET_VALUE"
          if [[ -n "${{ inputs.expires_on }}" ]]; then
            az keyvault secret set \
              --vault-name "${{ inputs.key_vault_name }}" \
              --name "${{ inputs.secret_name }}" \
              --value "$ROTATED_SECRET_VALUE" \
              --expires "${{ inputs.expires_on }}" \
              --output none
          else
            az keyvault secret set \
              --vault-name "${{ inputs.key_vault_name }}" \
              --name "${{ inputs.secret_name }}" \
              --value "$ROTATED_SECRET_VALUE" \
              --output none
          fi

      - name: Confirm active version metadata
        run: az keyvault secret show --vault-name "${{ inputs.key_vault_name }}" --name "${{ inputs.secret_name }}" --query '{id:id,expires:attributes.expires,enabled:attributes.enabled}'