name: Database migration and seed

on:
  workflow_dispatch:
    inputs:
      app_repository:
        description: Repository containing the Prisma schema and package files
        required: true
        type: string
      app_ref:
        description: Application revision to migrate
        required: true
        default: main
        type: string
      db_host:
        description: Private PostgreSQL server hostname
        required: true
        type: string
      db_name:
        description: Database name
        required: true
        type: string
      db_user:
        description: Entra principal name for the migration identity
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  migrate:
    name: Apply Prisma migrations and seed
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.app_repository }}
          ref: ${{ inputs.app_ref }}
          token: ${{ secrets.APP_REPOSITORY_TOKEN }}

      - name: Azure login using migration identity
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.MIGRATION_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install application dependencies
        run: npm ci

      - name: Acquire short lived PostgreSQL token
        shell: bash
        run: echo "PG_TOKEN=$(az account get-access-token --resource-type oss-rdbms --query accessToken --output tsv)" >> "$GITHUB_ENV"

      - name: Run Prisma migration and seed
        env:
          DB_USER: ${{ inputs.db_user }}
          DB_HOST: ${{ inputs.db_host }}
          DB_NAME: ${{ inputs.db_name }}
        shell: bash
        run: |
          set -euo pipefail
          export DATABASE_URL="postgresql://$(node -p 'encodeURIComponent(process.env.DB_USER)'):$(node -p 'encodeURIComponent(process.env.PG_TOKEN)')@${DB_HOST}:5432/${DB_NAME}?sslmode=require"
          npx prisma migrate deploy
          npx prisma db seed